name: ai_sports_training
description: "AI Sports Training & Pose Analysis Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^15.1.0
  firebase_core: 2.30.0
  firebase_auth: 4.15.0
  cloud_firestore: ^4.17.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  intl: 0.20.2
  equatable: ^2.0.5
  get_it: ^7.6.7
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  google_mlkit_pose_detection: ^0.13.0
  camera: ^0.11.0+2
  image: ^4.3.0
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  edge_tts: ^0.1.5
  path_provider: ^2.1.5
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true